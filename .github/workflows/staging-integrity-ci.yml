name: Staging Integrity CI

on:
  push:
    branches:
      - fix/staging-integrity-completion-20261120
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: staging-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --runInBand
      - run: npm run build

  migrations:
    name: Apply all migrations to disposable PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: absher_bi
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d absher_bi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Run complete migration chain against disposable database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/absher_bi
          DATABASE_SSL: "false"
        run: npx ts-node src/database/migrate.ts up

  frontends:
    name: ${{ matrix.app }} production build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [customer, store, driver, admin]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - name: Build frontend
        env:
          ABSHER_API_ORIGIN: https://absher-bi-backend-staging.onrender.com
        run: npm run build
