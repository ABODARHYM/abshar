# ABSHER BI - بيئة التشغيل المحلية
#   تشغيل FREE:  docker compose up -d --build
#   تشغيل PRO :  docker compose --profile pro up -d --build   (مع APP_TIER=PRO و REDIS_URL=redis://redis:6379)
name: absher-bi

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # مربوط بالجهاز المحلي فقط - لا يُعرَّض للشبكة
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      APP_TIER: ${APP_TIER:-FREE}
      PORT: 3000
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DATABASE_SSL: "false"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS:-2592000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      THROTTLE_TTL_SECONDS: ${THROTTLE_TTL_SECONDS:-60}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-120}
      STORAGE_URL: ${STORAGE_URL:-}
      NOTIFICATION_CONFIG: ${NOTIFICATION_CONFIG:-}
      REDIS_URL: ${REDIS_URL:-}
    ports:
      - "${PORT:-3000}:3000"
    # الهجرات تُطبَّق تلقائيًا قبل تشغيل السيرفر، وهي idempotent
    command: ["sh", "-c", "node dist/database/migrate.js up && node dist/main.js"]

  redis:
    image: redis:7-alpine
    profiles: ["pro"]
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
