<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>أبشر بي</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: radial-gradient(circle at 30% 20%, rgba(34,197,94,.15), transparent 50%),
                  radial-gradient(circle at 70% 80%, rgba(59,130,246,.10), transparent 50%),
                  linear-gradient(145deg, #07111f, #020617);
      color: #f8fafc;
      font-family: Tahoma, Arial, sans-serif;
      overflow: hidden;
    }
    .splash {
      height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 30px;
      animation: fade-in .5s ease-out;
    }
    .logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }
    .logo {
      width: 120px;
      height: 120px;
      border-radius: 32px;
      background: linear-gradient(135deg, #22c55e, #15803d);
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 64px;
      font-weight: 900;
      box-shadow: 0 20px 60px rgba(34,197,94,.35);
      animation: pop-in .6s cubic-bezier(.34,1.56,.64,1);
    }
    .app-name {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 1px;
    }
    .app-name-en {
      font-size: 12px;
      letter-spacing: 4px;
      color: #94a3b8;
      margin-top: 4px;
    }
    .tagline {
      color: #94a3b8;
      font-size: 14px;
      margin-top: 12px;
      max-width: 280px;
      line-height: 1.7;
    }
    .loader {
      margin-top: 40px;
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,.1);
      border-top-color: #22c55e;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    .footer {
      position: absolute;
      bottom: 30px;
      left: 0;
      right: 0;
      text-align: center;
      color: #475569;
      font-size: 11px;
      letter-spacing: 2px;
    }
    @keyframes pop-in {
      0% { transform: scale(.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="splash">
    <div class="logo-wrap">
      <div class="logo">أ</div>
      <div>
        <div class="app-name">أبشر بي</div>
        <div class="app-name-en">ABSHER BI</div>
      </div>
      <div class="tagline">اطلبها، وأبشر بي — منصة الطلب والتوصيل الذكية</div>
      <div class="loader"></div>
    </div>
  </div>
  <div class="footer">ABSHER BI © 2026</div>

  <script>
    // بعد 1.5 ثانية → انتقل إلى index.html
    setTimeout(function () {
      window.location.replace('./index.html');
    }, 1500);
  </script>
</body>
</html>
